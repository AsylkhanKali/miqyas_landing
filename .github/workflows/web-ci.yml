name: Web CI

on:
  push:
    branches: [main]
    paths: ["web/console/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/console/**", ".github/workflows/web-ci.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/console/package-lock.json
      - name: Install
        # package-lock.json появится при первой установке. До тех пор npm install.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
